spring.application.name=api-gateway

server.port=9090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enable discovery
spring.cloud.gateway.mvc.discovery.locator.enabled=true
spring.cloud.gateway.mvc.discovery.locator.lower-case-service-id=true

# Explicit route for Account Service
spring.cloud.gateway.mvc.routes[0].id=account-service
spring.cloud.gateway.mvc.routes[0].uri=lb://ACCOUNT-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/account-service/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

eureka.instance.hostname=localhost